
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <script>
        function validate() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var pwd = document.getElementById("pwd").value;
            var cpwd = document.getElementById("cpwd").value;
            var mobile = document.getElementById("mobile").value;
            var age = document.getElementById("age").value;
            var gender = document.querySelector('input[name="gender"]:checked');

            if (name.length < 3) {
                alert("Enter a valid name");
                return false;
            }

            if (!email.includes("@") || !email.includes(".")) {
                alert("Enter a valid email");
                return false;
            }

            if (pwd.length < 6) {
                alert("Password must have 6 characters");
                return false;
            }

            if (pwd != cpwd) {
                alert("Passwords do not match");
                return false;
            }

            if (!/^[6-9][0-9]{9}$/.test(mobile)) {
                alert("Enter a valid mobile number");
                return false;
            }

            if (age < 18 || age > 60 || age == "") {
                alert("Age must be between 18 and 60");
                return false;
            }

            if (!gender) {
                alert("Select your gender");
                return false;
            }

            alert("Registration Successful!");
            return true;
        }
    </script>
</head>

<body>
    <h2 align="center">Registration Form</h2>

    <form onsubmit="return validate()">
        Name: <input type="text" id="name"><br><br>

        Email: <input type="text" id="email"><br><br>

        Password: <input type="password" id="pwd"><br><br>

        Confirm Password: <input type="password" id="cpwd"><br><br>

        Mobile: <input type="text" id="mobile"><br><br>

        Age: <input type="number" id="age"><br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
